# Task Manager - full stack in Docker.
#
#   cp .env.example .env          # then set JWT_SECRET / POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:8080
#
# Optional demo data:   docker compose --profile seed run --rm seed
# Dev (hot reload):     docker compose -f docker-compose.yml -f compose.dev.yml up --build

name: task-manager

x-database-url: &database-url postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-task_manager}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<version>
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache: no persistence, bounded memory, evict least-recently-used keys.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # Applies Prisma migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks: [backend]

  # Demo users + tasks (password: Password123). Only runs when asked:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: ./backend
      target: migrate
    command: ['npx', 'prisma', 'db', 'seed']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [seed]
    restart: 'no'
    networks: [backend]

  api:
    build:
      context: ./backend
      target: runtime
    image: task-manager-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-60}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 1 # nginx sits in front
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published to the host: the browser reaches it through nginx (/api).
    expose: ['5000']
    stop_grace_period: 15s # > the app's 10s graceful-shutdown timeout
    networks: [backend, frontend]

  web:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_URL: /api
    image: task-manager-web:latest
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

volumes:
  pgdata:

# db and redis are only reachable from the API, never from the web container.
networks:
  backend:
  frontend:
